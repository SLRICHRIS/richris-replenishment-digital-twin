name: Build Windows AMR camera toolkit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'amr01_camera_setup.py'
      - 'amr01_camera_agent.py'
      - 'amr01_local_twin.py'
      - 'amr01_preset_routes.py'
      - 'automated_software_checks/streamlit_and_repository_integration_checks/verify_local_twin_http.py'
      - 'backend_streamlit_and_telemetry/vision_control/**'
      - 'esp32_telemetry_firmware/AMR01_Local_Routes/**'
      - 'project_documentation/direct_wifi_aruco_routes.md'
      - 'project_documentation/local_station_missions.md'
      - 'project_documentation/preset_station_routes.md'
      - '.github/workflows/build-windows-amr-camera.yml'
  pull_request:
    paths:
      - 'amr01_camera_setup.py'
      - 'amr01_camera_agent.py'
      - 'amr01_local_twin.py'
      - 'amr01_preset_routes.py'
      - 'automated_software_checks/streamlit_and_repository_integration_checks/verify_local_twin_http.py'
      - 'backend_streamlit_and_telemetry/vision_control/**'
      - 'esp32_telemetry_firmware/AMR01_Local_Routes/**'
      - 'project_documentation/direct_wifi_aruco_routes.md'
      - 'project_documentation/local_station_missions.md'
      - 'project_documentation/preset_station_routes.md'
      - '.github/workflows/build-windows-amr-camera.yml'

permissions:
  contents: read

jobs:
  build-preset-controller:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build camera-free preset controller
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.11,<7"
          python -m PyInstaller --clean --noconfirm --onefile --console --paths . --add-data "backend_streamlit_and_telemetry/vision_control/preset_routes.html;backend_streamlit_and_telemetry/vision_control" --name AMR01_PresetRoutes amr01_preset_routes.py
          & .\dist\AMR01_PresetRoutes.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Preset executable entry point failed' }
      - name: Verify packaged preset workspace without robot access
        shell: pwsh
        run: |
          python automated_software_checks/streamlit_and_repository_integration_checks/verify_local_twin_http.py --preset --executable .\dist\AMR01_PresetRoutes.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preset controller HTTP smoke check failed' }
      - name: Package preset controller
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preset-toolkit | Out-Null
          Copy-Item .\dist\AMR01_PresetRoutes.exe preset-toolkit\
          Copy-Item .\project_documentation\preset_station_routes.md preset-toolkit\README.md
          New-Item -ItemType Directory -Force -Path preset-toolkit\AMR01_Local_Routes | Out-Null
          Get-ChildItem .\esp32_telemetry_firmware\AMR01_Local_Routes\ -File |
            Where-Object { $_.Name -ne 'private_amr_settings.h' -and $_.Extension -in '.ino', '.h' } |
            Copy-Item -Destination preset-toolkit\AMR01_Local_Routes\
      - uses: actions/upload-artifact@v4
        with:
          name: AMR01-Windows-Preset-Routes
          path: preset-toolkit/
          retention-days: 14
          if-no-files-found: error
  build-camera-toolkit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundled camera runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend_streamlit_and_telemetry/vision_control/requirements-vision.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Build local webcam setup utility
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --paths . --collect-all cv2 --name AMR01_CameraSetup amr01_camera_setup.py
      - name: Build authenticated camera tracking agent
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --paths . --collect-all cv2 --name AMR01_CameraAgent amr01_camera_agent.py
      - name: Build direct Wi-Fi ArUco workspace
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --paths . --collect-all cv2 --hidden-import sqlalchemy.dialects.sqlite.pysqlite --add-data "backend_streamlit_and_telemetry/vision_control/local_twin.html;backend_streamlit_and_telemetry/vision_control" --add-data "backend_streamlit_and_telemetry/vision_control/example_camera_config.json;backend_streamlit_and_telemetry/vision_control" --name AMR01_LocalTwin amr01_local_twin.py
      - name: Verify executable entry points without hardware or credentials
        shell: pwsh
        run: |
          & .\dist\AMR01_CameraSetup.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Setup executable failed' }
          & .\dist\AMR01_CameraAgent.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Agent executable failed' }
          & .\dist\AMR01_LocalTwin.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Local twin executable failed' }
      - name: Verify packaged local HTTP workspace without connecting hardware
        shell: pwsh
        run: |
          python automated_software_checks/streamlit_and_repository_integration_checks/verify_local_twin_http.py --executable .\dist\AMR01_LocalTwin.exe
          if ($LASTEXITCODE -ne 0) { throw 'Local twin HTTP smoke check failed' }
      - name: Package unsigned tools without credentials or camera files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path camera-toolkit | Out-Null
          Copy-Item .\dist\AMR01_CameraSetup.exe camera-toolkit\
          Copy-Item .\dist\AMR01_CameraAgent.exe camera-toolkit\
          Copy-Item .\dist\AMR01_LocalTwin.exe camera-toolkit\
          Copy-Item .\backend_streamlit_and_telemetry\vision_control\example_camera_config.json camera-toolkit\
          Copy-Item .\project_documentation\direct_wifi_aruco_routes.md camera-toolkit\README.md
          Copy-Item .\project_documentation\local_station_missions.md camera-toolkit\local_station_missions.md
          Copy-Item .\project_documentation\windows_camera_agent_no_python.md camera-toolkit\legacy_mqtt_camera_agent.md
      - uses: actions/upload-artifact@v4
        with:
          name: AMR01-Windows-Camera-Toolkit
          path: camera-toolkit/
          retention-days: 14
          if-no-files-found: error
