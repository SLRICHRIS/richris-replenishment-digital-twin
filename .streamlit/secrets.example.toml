# Copy to PRIVATE .streamlit/secrets.toml or paste into Streamlit Cloud secrets.
# Example geometry/capacity/SOC/bias/threshold values below are NOT measurements.
[commissioning]
measured_calibration_confirmed = false

[mqtt]
host = "your-deployment.emqxsl.com"
username = "read-only-subscriber"
password = "replace-privately"

[calibration.amr01]
radius_left_m = 0.033
radius_right_m = 0.033
track_m = 0.20
counts_left_per_rev = 600
counts_right_per_rev = 600
capacity_ah = 2.0
initial_soc = 0.90
gyro_bias_rad_s = 0.01
residual_threshold_rad_s = 0.04
residual_hold_s = 0.5
max_gap_s = 1.0

# Reader-only PostgreSQL connection. Do not use the privileged writer account here.
# Set private measured calibration above and commissioning flag before live mode.
[database]
url = "postgresql+psycopg://amr_reader:REPLACE@db.example:5432/amr?sslmode=require"

# Optional owner-controlled Connect AMR panel. Do not enable while the
# independent ingestion worker is recording the same trial.
[amr_connection]
enabled = false
writer_url = "postgresql+psycopg://amr_writer:REPLACE@db.example:5432/amr?sslmode=require"
access_code = "REPLACE_WITH_A_PRIVATE_RANDOM_CODE_OF_AT_LEAST_16_CHARACTERS"
