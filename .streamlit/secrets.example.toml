# Copy to PRIVATE .streamlit/secrets.toml or paste into Streamlit Cloud secrets.
# Example geometry/capacity/SOC/bias/threshold values below are NOT measurements.
[commissioning]
measured_calibration_confirmed = false

[mqtt]
host = "your-deployment.emqxsl.com"
username = "read-only-subscriber"
password = "replace-privately"

[calibration.amr01]
radius_left_m = 0.033
radius_right_m = 0.033
track_m = 0.20
counts_left_per_rev = 600
counts_right_per_rev = 600
capacity_ah = 2.0
initial_soc = 0.90
gyro_bias_rad_s = 0.01
residual_threshold_rad_s = 0.04
residual_hold_s = 0.5
max_gap_s = 1.0

# Reader-only PostgreSQL connection. Do not use the privileged writer account here.
# Set private measured calibration above and commissioning flag before live mode.
[database]
url = "postgresql+psycopg://amr_reader:REPLACE@db.example:5432/amr?sslmode=require"

# Optional owner-controlled Connect AMR panel. Do not enable while the
# independent ingestion worker is recording the same trial.
[amr_connection]
enabled = false
writer_url = "postgresql+psycopg://amr_writer:REPLACE@db.example:5432/amr?sslmode=require"
access_code = "REPLACE_WITH_A_PRIVATE_RANDOM_CODE_OF_AT_LEAST_16_CHARACTERS"

# Physical AMR → Connect. Set enabled after the route broker identity and the
# restricted Neon audit login are configured. Leave commissioned false for
# connection checks until the attended camera and motor checks pass.
# An installation with working [manual_control] can instead use the browser
# receiver transport described in the physical route guide. When [vision_control]
# is absent, that connection provides authenticated receiver diagnostics only.
[vision_control]
enabled = false
commissioned = false
mqtt_host = "your-deployment.emqxsl.com"
mqtt_username = "REPLACE_WEBSITE_ROUTE_USERNAME"
mqtt_password = "REPLACE_WEBSITE_ROUTE_PASSWORD"
control_key = "REPLACE_WITH_A_PRIVATE_64_LOWERCASE_HEX_ROUTE_KEY"
audit_url = "postgresql+psycopg://amr_route_coordinator:REPLACE@direct-host/amr_twin?sslmode=require"

# Browser WebRTC route follower. Use a separate camera MQTT identity.
# Its drive key must match the H1 ESP32 receiver and differ from the route key.
[vision_browser]
enabled = false
transport_latency_verified = false
mqtt_host = "your-deployment.emqxsl.com"
mqtt_username = "REPLACE_CAMERA_CONTROLLER_USERNAME"
mqtt_password = "REPLACE_CAMERA_CONTROLLER_PASSWORD"
drive_key = "REPLACE_WITH_THE_PRIVATE_64_LOWERCASE_HEX_RECEIVER_KEY"
